<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">📋 Student List</h2>
<div class="row mb-3">

    <div class="col-md-6">

        <input
            type="text"
            id="searchBox"
            class="form-control"
            placeholder="🔍 Search by Register Number or Name">

    </div>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Register No</th>
<th>Name</th>
<th>Department</th>
<th>Year</th>
<th>Section</th>
<th>Attendance</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

<div class="modal fade" id="editModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Edit Student</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input id="editName" class="form-control mb-2" placeholder="Name">

<input id="editDepartment" class="form-control mb-2" placeholder="Department">

<input id="editYear" class="form-control mb-2" placeholder="Year">

<input id="editSection" class="form-control mb-2" placeholder="Section">

</div>

<div class="modal-footer">

<button class="btn btn-primary" id="saveStudent">

Save Changes

</button>

</div>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="student-list.js"></script>
</body>

</html>
