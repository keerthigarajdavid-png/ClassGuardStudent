<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Import Timetable - ClassGuard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container mt-5">

    <div class="card p-5 timetable-card">
        <div class="row g-3 mb-4">

    <div class="col-md-4">
        <label class="form-label">
            Department
        </label>

        <select id="department" class="form-select">
            <option value="">Select Department</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
        </select>
    </div>


    <div class="col-md-4">
        <label class="form-label">
            Year
        </label>

        <select id="year" class="form-select">
            <option value="">Select Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>
    </div>


    <div class="col-md-4">
        <label class="form-label">
            Section
        </label>

        <select id="section" class="form-select">
            <option value="">Select Section</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>
    </div>

</div>

        <div class="text-center">

            <i class="fa-solid fa-calendar-days timetable-icon"></i>

            <h2 class="mt-3">
                Import Timetable
            </h2>

            <p class="text-muted">
                Upload timetable using Excel or PDF
            </p>

        </div>


        <!-- Excel -->

        <div class="import-box">

            <i class="fa-solid fa-file-excel"></i>

            <h5>Excel Timetable</h5>

            <p>
                Upload .xlsx, .xls or .csv
            </p>

            <button
                class="btn btn-success"
                id="excelBtn">

                <i class="fa-solid fa-upload"></i>
                Choose Excel

            </button>

            <input
                type="file"
                id="excelFile"
                accept=".xlsx,.xls,.csv"
                hidden>

        </div>


        <!-- PDF -->

        <div class="import-box">

            <i class="fa-solid fa-file-pdf"></i>

            <h5>PDF Timetable</h5>

            <p>
                Upload timetable PDF
            </p>

            <button
                class="btn btn-danger"
                id="pdfBtn">

                <i class="fa-solid fa-upload"></i>
                Choose PDF

            </button>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf"
                hidden>

        </div>


        <div id="status"
             class="text-center mt-4">
        </div>


        <button
            class="btn btn-secondary w-100 mt-4"
            onclick="window.location.href='dashboard.html'">

            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard

        </button>

    </div>

</div>


<!-- Excel Library -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


<!-- PDF Library -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script type="module" src="timetable.js"></script>

</body>

</html>
