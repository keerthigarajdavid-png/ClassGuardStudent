<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassGuard Advisor</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🛡️
        </div>

        <h1>ClassGuard</h1>

        <p class="subtitle">Advisor Login</p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
